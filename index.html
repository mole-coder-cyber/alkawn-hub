<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#18212b">
<link rel="manifest" href="manifest.json">
<title>Alkawn Hub — Attendance</title>
<style>
:root{--bg:#f4f6f8;--card:#fff;--text:#18212b;--muted:#66717d;--line:#dfe4e8;--accent:#315f78;--good:#18794e;--bad:#b42318;--warn:#9a6700;--shadow:0 2px 12px #0000000d}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--text)}
button,input,select,textarea{font:inherit}button{cursor:pointer}.app{min-height:100vh}
header{position:sticky;top:0;z-index:5;background:var(--text);color:#fff;padding:14px 18px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{font-weight:800;font-size:19px}.brand small{display:block;font-size:11px;font-weight:500;opacity:.7}
.header-actions{display:flex;gap:7px;flex-wrap:wrap}header button{background:#ffffff16;color:#fff;border:1px solid #ffffff30;border-radius:8px;padding:8px 11px}
main{max-width:1050px;margin:auto;padding:18px}.nav{display:flex;gap:7px;overflow:auto;margin-bottom:18px}.nav button{border:1px solid var(--line);background:var(--card);padding:10px 14px;border-radius:9px;white-space:nowrap}.nav button.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.view{display:none}.view.active{display:block}.grid{display:grid;gap:14px}.grid.two{grid-template-columns:repeat(2,minmax(0,1fr))}.grid.three{grid-template-columns:repeat(3,minmax(0,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;box-shadow:var(--shadow)}h1{font-size:24px;margin:0 0 5px}h2{font-size:18px;margin:0 0 12px}h3{font-size:15px;margin:0 0 7px}.muted{color:var(--muted)}.small{font-size:13px}
label{display:block;font-size:13px;font-weight:650;margin:10px 0 5px}input,select,textarea{width:100%;padding:10px;border:1px solid #cbd2d8;border-radius:8px;background:#fff;color:var(--text)}textarea{min-height:80px;resize:vertical}
.row{display:flex;gap:9px;align-items:center;justify-content:space-between;flex-wrap:wrap}.actions{display:flex;gap:8px;flex-wrap:wrap}.btn{border:1px solid #cbd2d8;background:#fff;color:var(--text);padding:9px 12px;border-radius:8px}.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}.btn.good{background:var(--good);border-color:var(--good);color:#fff}.btn.danger{background:#fff;border-color:#e6aaa5;color:var(--bad)}.btn:disabled{opacity:.5;cursor:not-allowed}
.stat{font-size:28px;font-weight:800}.stat-label{font-size:12px;color:var(--muted)}
.list{display:flex;flex-direction:column;gap:8px}.list-item{border:1px solid var(--line);border-radius:9px;padding:12px;background:#fff}.list-item.clickable{cursor:pointer}.list-item.clickable:hover{border-color:#aeb8c1}
.badge{display:inline-flex;align-items:center;border-radius:999px;padding:3px 8px;font-size:12px;font-weight:700}.present{background:#e5f6ed;color:var(--good)}.absent{background:#fdebea;color:var(--bad)}.pending{background:#fff4d6;color:var(--warn)}.inactive{background:#edf0f2;color:#66717d}
.att-row{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:12px;background:#fff}.att-main{min-width:0}.att-name{font-weight:750}.att-meta{font-size:12px;color:var(--muted)}.att-buttons{display:flex;gap:6px}.att-buttons button{min-width:78px;padding:10px 8px;border-radius:8px;border:1px solid #ccd3d9;background:#fff}.att-buttons .selected-present{background:#e5f6ed;border-color:#7bc79e;color:var(--good);font-weight:800}.att-buttons .selected-absent{background:#fdebea;border-color:#e39b95;color:var(--bad);font-weight:800}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:9px;border-bottom:1px solid var(--line);font-size:14px}th{color:var(--muted);font-size:12px}.empty{text-align:center;padding:28px;color:var(--muted)}
dialog{border:0;border-radius:13px;padding:0;width:min(560px,calc(100% - 24px));box-shadow:0 15px 50px #0005}dialog::backdrop{background:#0006}.modal{padding:18px}.modal h2{margin-bottom:3px}.toast{position:fixed;right:16px;bottom:16px;background:var(--text);color:#fff;padding:11px 14px;border-radius:9px;box-shadow:0 6px 20px #0003;display:none;z-index:20}.toast.show{display:block}
@media(max-width:700px){main{padding:12px}.grid.two,.grid.three{grid-template-columns:1fr}.att-row{grid-template-columns:1fr}.att-buttons button{flex:1}.att-buttons{width:100%}header{align-items:flex-start}.header-actions{justify-content:flex-end}}
</style>
</head>
<body>
<div class="app">
<header>
  <div class="brand">Alkawn Hub <small>Attendance</small></div>
  <div class="header-actions">
    <button onclick="exportData()">Backup</button>
    <button onclick="document.getElementById('importFile').click()">Restore</button>
    <input id="importFile" type="file" accept=".json" hidden onchange="importData(event)">
  </div>
</header>
<main>
  <nav class="nav">
    <button data-view="attendance" class="active">Attendance</button>
    <button data-view="students">Students</button>
    <button data-view="classes">Classes</button>
    <button data-view="history">History</button>
  </nav>

  <section id="attendance" class="view active">
    <div class="row" style="margin-bottom:14px">
      <div><h1>Take Attendance</h1><div class="muted">Choose a class and date, then mark each student.</div></div>
      <button class="btn primary" onclick="openQuickSession()">Open Today</button>
    </div>
    <div class="card">
      <div class="grid two">
        <div><label>Class</label><select id="attClass" onchange="renderAttendance()"></select></div>
        <div><label>Date</label><input id="attDate" type="date" onchange="renderAttendance()"></div>
      </div>
    </div>
    <div id="attendanceArea" style="margin-top:14px"></div>
  </section>

  <section id="students" class="view">
    <div class="row" style="margin-bottom:14px"><div><h1>Students</h1><div class="muted">One profile per student.</div></div><button class="btn primary" onclick="openStudent()">+ Student</button></div>
    <div class="card"><input id="studentSearch" placeholder="Search students..." oninput="renderStudents()"></div>
    <div id="studentsArea" class="list" style="margin-top:14px"></div>
  </section>

  <section id="classes" class="view">
    <div class="row" style="margin-bottom:14px"><div><h1>Classes</h1><div class="muted">Recurring classes and their default student lists.</div></div><button class="btn primary" onclick="openClass()">+ Class</button></div>
    <div id="classesArea" class="list"></div>
  </section>

  <section id="history" class="view">
    <div class="row" style="margin-bottom:14px"><div><h1>Attendance History</h1><div class="muted">Review attendance by student, class or date.</div></div></div>
    <div class="card">
      <div class="grid three">
        <div><label>Student</label><select id="histStudent" onchange="renderHistory()"></select></div>
        <div><label>Class</label><select id="histClass" onchange="renderHistory()"></select></div>
        <div><label>Month</label><input id="histMonth" type="month" onchange="renderHistory()"></div>
      </div>
    </div>
    <div id="historyArea" style="margin-top:14px"></div>
  </section>
</main>
</div>

<dialog id="modal"><div class="modal" id="modalBody"></div></dialog>
<div id="toast" class="toast"></div>

<script>
const KEY="alkawnAttendanceV1";
let db=load();
const $=id=>document.getElementById(id);
const uid=()=>crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36)+Math.random().toString(36).slice(2);
function load(){try{return JSON.parse(localStorage.getItem(KEY))||{students:[],classes:[],attendance:[]}}catch{return {students:[],classes:[],attendance:[]}}}
function save(){localStorage.setItem(KEY,JSON.stringify(db))}
function today(){return new Date().toISOString().slice(0,10)}
function fmt(d){return new Date(d+"T12:00:00").toLocaleDateString(undefined,{day:"numeric",month:"short",year:"numeric"})}
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]))}
function toast(t){let x=$("toast");x.textContent=t;x.classList.add("show");setTimeout(()=>x.classList.remove("show"),1800)}
function openModal(html){$("modalBody").innerHTML=html;$("modal").showModal()}
function closeModal(){$("modal").close()}
$("modal").addEventListener("click",e=>{if(e.target===$("modal"))closeModal()})

document.querySelectorAll(".nav button").forEach(b=>b.onclick=()=>showView(b.dataset.view));
function showView(v){document.querySelectorAll(".view").forEach(x=>x.classList.remove("active"));$(v).classList.add("active");document.querySelectorAll(".nav button").forEach(x=>x.classList.toggle("active",x.dataset.view===v));refresh(v)}

function refresh(v){if(v==="attendance"){populateSelectors();renderAttendance()}if(v==="students")renderStudents();if(v==="classes")renderClasses();if(v==="history"){populateHistorySelectors();renderHistory()}}
function populateSelectors(){
 let c=$("attClass"), old=c.value;c.innerHTML=db.classes.map(x=>`<option value="${x.id}">${esc(x.name)}${x.day?" — "+esc(x.day):""}</option>`).join("");
 if(old&&db.classes.some(x=>x.id===old))c.value=old;
 $("attDate").value=$("attDate").value||today();
}
function openQuickSession(){showView("attendance");$("attDate").value=today();if(!$("attClass").value&&db.classes[0])$("attClass").value=db.classes[0].id;renderAttendance()}
function sessionKey(classId,date){return classId+"|"+date}
function getRecord(classId,date){return db.attendance.find(x=>x.classId===classId&&x.date===date)}
function ensureRecord(classId,date){
 let r=getRecord(classId,date);if(r)return r;
 let c=db.classes.find(x=>x.id===classId);if(!c)return null;
 r={id:uid(),classId,date,status:"open",records:c.studentIds.map(studentId=>({studentId,status:null,reason:"",temporary:false}))};
 db.attendance.push(r);save();return r;
}
function renderAttendance(){
 let c=db.classes.find(x=>x.id===$("attClass").value),date=$("attDate").value;
 if(!c){$("attendanceArea").innerHTML=`<div class="card empty">Create a class first, then add students to its default list.</div>`;return}
 let r=ensureRecord(c.id,date), present=r.records.filter(x=>x.status==="present").length, absent=r.records.filter(x=>x.status==="absent").length;
 let known=r.records.filter(x=>!x.temporary), temp=r.records.filter(x=>x.temporary);
 $("attendanceArea").innerHTML=`
 <div class="card">
   <div class="row"><div><h2>${esc(c.name)}</h2><div class="muted">${fmt(date)}${c.time?" · "+esc(c.time):""}</div></div>
   <div class="actions"><span class="badge present">${present} present</span><span class="badge absent">${absent} absent</span><span class="badge pending">${r.records.length-present-absent} not marked</span></div></div>
 </div>
 <div class="list" style="margin-top:12px">
 ${r.records.map(a=>attendanceRow(a,c.id,date)).join("")}
 </div>
 <div class="card" style="margin-top:12px">
   <div class="row"><div><h3>Finished?</h3><div class="small muted">Complete this session when you are done. You can still reopen and correct it later.</div></div>
   <div class="actions"><button class="btn" onclick="addTemporary('${c.id}','${date}')">+ Temporary student</button>
   <button class="btn ${r.status==="completed"?"good":"primary"}" onclick="toggleComplete('${r.id}')">${r.status==="completed"?"Completed — Reopen":"Complete Attendance"}</button></div></div>
 </div>`;
}
function attendanceRow(a,classId,date){
 let s=db.students.find(x=>x.id===a.studentId);
 let name=s?esc(s.name):esc(a.name||"Temporary student");
 return `<div class="att-row">
 <div class="att-main"><div class="att-name">${name} ${a.temporary?'<span class="badge pending">Temporary</span>':""}</div><div class="att-meta">${a.status==="absent"&&a.reason?esc(a.reason):a.status?esc(a.status):"Not marked"}</div></div>
 <div class="att-buttons">
 <button class="${a.status==="present"?"selected-present":""}" onclick="setAttendance('${classId}','${date}','${a.studentId||""}','present')">Present</button>
 <button class="${a.status==="absent"?"selected-absent":""}" onclick="setAttendance('${classId}','${date}','${a.studentId||""}','absent')">Absent</button>
 ${a.status==="absent"?`<button onclick="editReason('${classId}','${date}','${a.studentId||""}')">Reason</button>`:""}
 </div></div>`
}
function setAttendance(classId,date,studentId,status){
 let r=getRecord(classId,date),a=r.records.find(x=>x.studentId===studentId);
 if(!a)return;a.status=status;if(status==="present")a.reason="";
 save();renderAttendance();toast("Saved")
}
function editReason(classId,date,studentId){
 let r=getRecord(classId,date),a=r.records.find(x=>x.studentId===studentId);if(!a)return;
 openModal(`<h2>Absence reason</h2><div class="muted small">Optional. Leave blank if you don't need one.</div><label>Reason</label><input id="reasonInput" value="${esc(a.reason)}" placeholder="e.g. Sick"><div class="actions" style="margin-top:14px;justify-content:flex-end"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="saveReason('${classId}','${date}','${studentId}')">Save</button></div>`)
}
function saveReason(classId,date,studentId){let a=getRecord(classId,date).records.find(x=>x.studentId===studentId);a.reason=$("reasonInput").value.trim();save();closeModal();renderAttendance()}
function toggleComplete(id){let r=db.attendance.find(x=>x.id===id);if(!r)return;r.status=r.status==="completed"?"open":"completed";save();renderAttendance();toast(r.status==="completed"?"Attendance completed":"Reopened")}
function addTemporary(classId,date){
 openModal(`<h2>Add temporary student</h2><div class="muted small">This person will be recorded for this session only and will not be added to the class permanently.</div><label>Name</label><input id="tempName" placeholder="Student name"><div class="actions" style="margin-top:14px;justify-content:flex-end"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="saveTemporary('${classId}','${date}')">Add</button></div>`)
}
function saveTemporary(classId,date){let name=$("tempName").value.trim();if(!name)return;let r=getRecord(classId,date);r.records.push({studentId:"temp_"+uid(),name,status:null,reason:"",temporary:true});save();closeModal();renderAttendance();toast("Temporary student added")}

function openStudent(id=""){
 let s=db.students.find(x=>x.id===id)||{name:"",active:true,notes:""};
 openModal(`<h2>${id?"Edit":"Add"} Student</h2><label>Name</label><input id="sName" value="${esc(s.name)}" placeholder="Full name"><label>Status</label><select id="sActive"><option value="true" ${s.active?"selected":""}>Active</option><option value="false" ${!s.active?"selected":""}>Inactive</option></select><label>Notes</label><textarea id="sNotes" placeholder="Optional">${esc(s.notes||"")}</textarea><div class="actions" style="margin-top:14px;justify-content:flex-end"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="saveStudent('${id}')">Save</button></div>`)
}
function saveStudent(id){let name=$("sName").value.trim();if(!name){alert("Enter a student name.");return}if(id){let s=db.students.find(x=>x.id===id);s.name=name;s.active=$("sActive").value==="true";s.notes=$("sNotes").value}else db.students.push({id:uid(),name,active:$("sActive").value==="true",notes:$("sNotes").value});save();closeModal();renderStudents();renderClasses();toast("Student saved")}
function renderStudents(){
 let q=($("studentSearch")?.value||"").toLowerCase(),arr=db.students.filter(s=>s.name.toLowerCase().includes(q));
 $("studentsArea").innerHTML=arr.length?arr.map(s=>`<div class="list-item clickable" onclick="studentProfile('${s.id}')"><div class="row"><div><b>${esc(s.name)}</b><div class="small muted">${s.active?"Active":"Inactive"} · ${attendanceStats(s.id).attended}/${attendanceStats(s.id).total} attended</div></div><span class="badge ${s.active?"present":"inactive"}">${s.active?"Active":"Inactive"}</span></div></div>`).join(""):`<div class="card empty">No students yet. Add your first student.</div>`
}
function attendanceStats(studentId){let arr=[];db.attendance.forEach(r=>r.records.forEach(a=>{if(a.studentId===studentId)arr.push(a)}));return {total:arr.length,attended:arr.filter(a=>a.status==="present").length,absent:arr.filter(a=>a.status==="absent").length}}
function studentProfile(id){
 let s=db.students.find(x=>x.id===id),rows=[];db.attendance.forEach(r=>{let a=r.records.find(x=>x.studentId===id);if(a){let c=db.classes.find(x=>x.id===r.classId);rows.push({date:r.date,className:c?.name||"Unknown",status:a.status,reason:a.reason})}});rows.sort((a,b)=>b.date.localeCompare(a.date));
 let st=attendanceStats(id);
 openModal(`<div class="row"><div><h2>${esc(s.name)}</h2><div class="muted">${s.active?"Active":"Inactive"}</div></div><button class="btn" onclick="closeModal();openStudent('${id}')">Edit</button></div><div class="grid three" style="margin:14px 0"><div class="card"><div class="stat">${st.total}</div><div class="stat-label">Recorded</div></div><div class="card"><div class="stat">${st.attended}</div><div class="stat-label">Present</div></div><div class="card"><div class="stat">${st.absent}</div><div class="stat-label">Absent</div></div></div><h3>Attendance History</h3>${rows.length?`<table><thead><tr><th>Date</th><th>Class</th><th>Result</th></tr></thead><tbody>${rows.map(x=>`<tr><td>${fmt(x.date)}</td><td>${esc(x.className)}</td><td><span class="badge ${x.status==="present"?"present":x.status==="absent"?"absent":"pending"}">${x.status||"Not marked"}</span>${x.reason?` <span class="small muted">— ${esc(x.reason)}</span>`:""}</td></tr>`).join("")}</tbody></table>`:`<div class="empty">No attendance has been recorded for this student yet.</div>`}<div class="actions" style="margin-top:14px;justify-content:flex-end"><button class="btn" onclick="closeModal()">Close</button></div>`)
}

function openClass(id=""){
 let c=db.classes.find(x=>x.id===id)||{name:"",day:"",time:"",notes:"",studentIds:[]};
 let opts=db.students.filter(s=>s.active).map(s=>`<label style="display:flex;gap:8px;align-items:center;font-weight:500"><input class="classStudent" type="checkbox" value="${s.id}" ${c.studentIds.includes(s.id)?"checked":""}> ${esc(s.name)}</label>`).join("")||'<div class="muted small">Add active students first.</div>';
 openModal(`<h2>${id?"Edit":"Add"} Recurring Class</h2><label>Class name</label><input id="cName" value="${esc(c.name)}" placeholder="e.g. Monday Tai Chi"><div class="grid two"><div><label>Day</label><select id="cDay">${["Monday","Tuesday","Wednesday","Thursday","Friday","Saturday","Sunday"].map(x=>`<option ${c.day===x?"selected":""}>${x}</option>`).join("")}</select></div><div><label>Time</label><input id="cTime" type="time" value="${esc(c.time)}"></div></div><label>Default students</label><div class="list" style="max-height:230px;overflow:auto">${opts}</div><label>Notes</label><textarea id="cNotes">${esc(c.notes||"")}</textarea><div class="actions" style="margin-top:14px;justify-content:flex-end"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="saveClass('${id}')">Save Class</button></div>`)
}
function saveClass(id){let name=$("cName").value.trim();if(!name){alert("Enter a class name.");return}let studentIds=[...document.querySelectorAll(".classStudent:checked")].map(x=>x.value);let obj={name,day:$("cDay").value,time:$("cTime").value,studentIds,notes:$("cNotes").value};if(id)Object.assign(db.classes.find(x=>x.id===id),obj);else db.classes.push({id:uid(),...obj});save();closeModal();populateSelectors();renderClasses();toast("Class saved")}
function renderClasses(){
 $("classesArea").innerHTML=db.classes.length?db.classes.map(c=>`<div class="card"><div class="row"><div><h2>${esc(c.name)}</h2><div class="muted">${esc(c.day)}${c.time?" · "+esc(c.time):""} · ${c.studentIds.length} default students</div></div><div class="actions"><button class="btn" onclick="openClass('${c.id}')">Edit</button><button class="btn primary" onclick="openClassAttendance('${c.id}')">Take Attendance</button></div></div><div class="small muted" style="margin-top:8px">${c.studentIds.map(id=>esc(db.students.find(s=>s.id===id)?.name||"Unknown")).join(", ")||"No students assigned yet."}</div></div>`).join(""):`<div class="card empty">No classes yet. Create a recurring class and choose its default students.</div>`
}
function openClassAttendance(id){showView("attendance");$("attClass").value=id;$("attDate").value=today();renderAttendance()}

function populateHistorySelectors(){
 let s=$("histStudent"),c=$("histClass"),sv=s.value,cv=c.value;
 s.innerHTML='<option value="">All students</option>'+db.students.map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join("");
 c.innerHTML='<option value="">All classes</option>'+db.classes.map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join("");
 if(sv)s.value=sv;if(cv)c.value=cv;
 $("histMonth").value=$("histMonth").value||today().slice(0,7);
}
function renderHistory(){
 let sid=$("histStudent").value,cid=$("histClass").value,month=$("histMonth").value;
 let rows=[];
 db.attendance.forEach(r=>{if(month&&r.date.slice(0,7)!==month)return;if(cid&&r.classId!==cid)return;let c=db.classes.find(x=>x.id===r.classId);r.records.forEach(a=>{if(sid&&a.studentId!==sid)return;let s=db.students.find(x=>x.id===a.studentId);rows.push({date:r.date,className:c?.name||"Unknown",student:s?.name||a.name||"Temporary",status:a.status,reason:a.reason})})});
 rows.sort((a,b)=>b.date.localeCompare(a.date)||a.student.localeCompare(b.student));
 let p=rows.filter(x=>x.status==="present").length,a=rows.filter(x=>x.status==="absent").length;
 $("historyArea").innerHTML=`<div class="grid three"><div class="card"><div class="stat">${rows.length}</div><div class="stat-label">Attendance records</div></div><div class="card"><div class="stat">${p}</div><div class="stat-label">Present</div></div><div class="card"><div class="stat">${a}</div><div class="stat-label">Absent</div></div></div><div class="card" style="margin-top:14px">${rows.length?`<table><thead><tr><th>Date</th><th>Student</th><th>Class</th><th>Result</th></tr></thead><tbody>${rows.map(x=>`<tr><td>${fmt(x.date)}</td><td>${esc(x.student)}</td><td>${esc(x.className)}</td><td><span class="badge ${x.status==="present"?"present":x.status==="absent"?"absent":"pending"}">${x.status||"Not marked"}</span>${x.reason?` <span class="small muted">— ${esc(x.reason)}</span>`:""}</td></tr>`).join("")}</tbody></table>`:`<div class="empty">No attendance records match these filters.</div>`}</div>`
}

function exportData(){
 let blob=new Blob([JSON.stringify(db,null,2)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="alkawn-attendance-backup-"+today()+".json";a.click();URL.revokeObjectURL(a.href);toast("Backup downloaded")}
function importData(e){
